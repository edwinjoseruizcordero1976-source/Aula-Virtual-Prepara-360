}
async function downloadResource(resId) {
  const res = appState.resources.find(r => r.id === resId);
  if (!res || !res.media || res.media.kind !== 'file') return;
  const att = { ...res.media };
  mediaCache[att.fileId || att.id] = att;
  const blob = await getMediaBlob(att);
  if (!blob) { showToast('No se encontró el archivo en este navegador.', 'warning'); return; }
  await downloadMedia(att.fileId || att.id);
  res.downloads = (res.downloads || 0) + 1;
  saveAppState(appState);
  renderApp();
}

async function handleResourceFormSubmit(e, resId) {
  e.preventDefault();
  const res = resId ? appState.resources.find(r => r.id === resId) : null;
  const subj = document.getElementById('res-subj').value;
  const title = document.getElementById('res-title').value.trim();
  const desc = document.getElementById('res-desc').value.trim();
  const type = document.getElementById('res-type').value;
  const rawLink = document.getElementById('res-link').value.trim();
  let link = '';
  if (rawLink) {
    link = normalizeLinkUrl(rawLink);
    if (!link) { showToast('El enlace no es válido. Revisa la dirección.', 'warning'); return; }
  }

  let media = null;
  const oldFileId = res && res.media && res.media.kind === 'file' ? (res.media.fileId || res.media.id) : null;
  let newId = null;
  if (resFormNewFile) {
    newId = 'res-file-' + Date.now() + '-' + Math.floor(Math.random() * 100000);
    try { await saveFileBlob(newId, resFormNewFile); }
    catch (err) { showToast('No se pudo guardar el archivo en este navegador. Intenta con uno más pequeño o usa un enlace.', 'warning'); return; }
    media = { kind: 'file', id: newId, fileId: newId, name: resFormNewFile.name, size: resFormNewFile.size, mime: resFormNewFile.type || '' };
  } else if (resFormMedia && resFormMedia.kind === 'file') {
    media = resFormMedia;
  } else if (link) {
    media = { kind: 'link', id: 'res-link-' + Date.now(), name: title, url: link };
  }
  if (!media) { showToast('Agrega un archivo o un enlace para que los participantes puedan ver el recurso.', 'warning'); return; }

  const keepFileId = media.kind === 'file' ? (media.fileId || media.id) : null;
  if (oldFileId && oldFileId !== keepFileId) deleteFileBlob(oldFileId);

  if (res) {
    Object.assign(res, { subject: subj, title, description: desc, type, media, size: media.kind === 'file' ? formatFileSize(media.size) : 'Enlace' });
    showToast(`Recurso "${title}" actualizado.`, 'success');
  } else {
    appState.resources.unshift({
      id: 'res-' + Date.now(), subject: subj, title, description: desc, type,
      size: media.kind === 'file' ? formatFileSize(media.size) : 'Enlace',
      media, uploadedBy: appState.teacherProfile.name, downloads: 0
    });
    showToast(`¡Recurso "${title}" publicado en la biblioteca!`, 'success');
  }
  saveAppState(appState);
  closeModal('modal-create-res');
  renderApp();
}

function deleteResource(resId) {
  if (appState.currentRole !== 'teacher') return;
  if (confirm('¿Deseas eliminar este recurso didáctico?')) {
    const r = appState.resources.find(x => x.id === resId);
    if (r && r.media && r.media.kind === 'file') deleteFileBlob(r.media.fileId || r.media.id);
    appState.resources = appState.resources.filter(x => x.id !== resId);
    saveAppState(appState);
    renderApp();
    showToast('Recurso didáctico eliminado.', 'info');
  }
}

const EVENT_TYPES = {
  clase:      { label: 'Clase',      color: '#2563eb', icon: '📘' },
  actividad:  { label: 'Actividad',  color: '#10b981', icon: '🎯' },
  evaluacion: { label: 'Evaluación', color: '#ef4444', icon: '📝' },
  entrega:    { label: 'Entrega de tarea', color: '#f59e0b', icon: '📤' },
  otro:       { label: 'Otro',       color: '#8b5cf6', icon: '📌' }
};
const WEEKDAYS_FULL = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let calSubject = 'all';

function pad2(n) { return String(n).padStart(2, '0'); }
function toYMD(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function parseYMD(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function fmtYMD(s) { if (!s) return ''; const d = parseYMD(s); return `${WEEKDAYS_FULL[d.getDay()]} ${d.getDate()} de ${MONTHS_ES[d.getMonth()]} de ${d.getFullYear()}`; }

function eventOccursOn(ev, ymd) {
  if (ev.repeat === 'weekly') {
    if (ymd < ev.date) return false;
    if (ev.until && ymd > ev.until) return false;
    return (ev.days || []).includes(parseYMD(ymd).getDay());
  }
  return ev.date === ymd;
}
function calendarItemsOn(ymd) {
  const items = [];
  (appState.events || []).forEach(ev => {
    if (calSubject !== 'all' && ev.subject && ev.subject !== calSubject) return;
    if (eventOccursOn(ev, ymd)) items.push({ kind: 'event', id: ev.id, title: ev.title, type: ev.type, time: ev.start || '', subject: ev.subject });
  });
  appState.tasks.forEach(t => {
    if (!t.dueISO || t.dueISO.slice(0, 10) !== ymd) return;
    if (calSubject !== 'all' && t.subject !== calSubject) return;
    items.push({ kind: 'task', id: t.id, title: 'Entrega: ' + t.title, type: 'entrega', time: t.dueISO.slice(11, 16), subject: t.subject });
  });
  return items.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
}

function calShift(n) {
  calMonth += n;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderApp();
}
function calToday() { const d = new Date(); calYear = d.getFullYear(); calMonth = d.getMonth(); renderApp(); }
function setCalSubject(v) { calSubject = v; renderApp(); }

        ${upcoming.map(it => {

          return `<div onclick="openCalendarItem('${it.kind}', '${it.id}', '${it.ymd}')" style="display:flex; gap:0.6rem; align-items:center; border:1px solid var(--border); border-left:4px solid ${t.color}; border-radius:var(--radius-md); padding:0.5rem 0.8rem; background:white; cursor:pointer; flex-wrap:wrap;">

function handleEventFormSubmit(e, eventId) {
  e.preventDefault();
  const repeat = document.getElementById('ev-repeat').checked;
  const days = Array.from(document.querySelectorAll('.ev-day')).filter(c => c.checked).map(c => parseInt(c.value, 10));
  const date = document.getElementById('ev-date').value;
  const until = document.getElementById('ev-until').value;
  const start = document.getElementById('ev-start').value, end = document.getElementById('ev-end').value;
  if (repeat && !days.length) { showToast('Marca al menos un día de la semana.', 'warning'); return; }
  if (repeat && (!until || until < date)) { showToast('La fecha "Hasta" debe ser posterior a la fecha de inicio.', 'warning'); return; }
  if (start && end && end <= start) { showToast('La hora de fin debe ser posterior a la de inicio.', 'warning'); return; }
  const data = {
    title: document.getElementById('ev-title').value.trim(),
    subject: document.getElementById('ev-subject').value,
    type: document.getElementById('ev-type').value,
    date, start, end, notes: document.getElementById('ev-notes').value.trim(),
    repeat: repeat ? 'weekly' : 'none', days: repeat ? days : [], until: repeat ? until : ''
  };
  appState.events = appState.events || [];
  if (eventId) Object.assign(appState.events.find(x => x.id === eventId), data);
  else appState.events.push({ id: 'ev-' + Date.now(), ...data });
  saveAppState(appState);
  closeModal('modal-event-form');
  renderApp();
  showToast('Calendario actualizado.', 'success');
}

function deleteCalendarEvent(id) {
  if (appState.currentRole !== 'teacher') return;
  if (!confirm('¿Eliminar esta clase/actividad del calendario?')) return;
  appState.events = (appState.events || []).filter(e => e.id !== id);
  saveAppState(appState);
  closeModal('modal-event-detail');
  renderApp();
  showToast('Eliminada del calendario.', 'info');
}

// ============================================================
// REGISTRO DE GRADO Y CALIFICACIONES
// ============================================================
let gbSubject = '';
let gbPeriod = 'all';

function gbData() {
  if (!appState.gradebook) appState.gradebook = { passing: 70, activities: [], scores: {} };
  return appState.gradebook;
}
function gbItems(subject, period) {
  const gb = gbData();
  const items = [];
  appState.tasks.filter(t => t.subject === subject).forEach(t => {
    if (period === 'all' || String(t.period || 1) === String(period)) items.push({ kind: 'task', id: t.id, title: t.title, max: t.points, period: t.period || 1 });
  });
  gb.activities.filter(a => a.subject === subject).forEach(a => {
    if (period === 'all' || String(a.period) === String(period)) items.push({ kind: 'act', id: a.id, title: a.title, max: a.max, period: a.period });
  });
  return items;
}
function gbScore(item, sid) {
  if (item.kind === 'task') {
    const t = appState.tasks.find(x => x.id === item.id);
    const s = t && getSubmission(t, sid);
    return s && s.grade !== null && s.grade !== undefined ? s.grade : null;
  }
  const v = (gbData().scores[item.id] || {})[sid];
  return v === undefined || v === '' || v === null ? null : v;
}
function gbTotals(items, sid) {
  let got = 0, poss = 0, n = 0;
  items.forEach(it => { const v = gbScore(it, sid); if (v !== null) { got += v; poss += it.max; n++; } });
  const pct = poss > 0 ? Math.round((got / poss) * 1000) / 10 : null;
  return { got: Math.round(got * 100) / 100, poss, n, pct };
}
function gbStatus(pct) {
  if (pct === null) return '<span style="color:var(--text-muted);">—</span>';
  return pct >= gbData().passing ? '<span class="badge badge-success">Aprobado</span>' : '<span class="badge" style="background:#fee2e2; color:#b91c1c;">Reprobado</span>';
}

function setGbSubject(v) { gbSubject = v; renderApp(); }
function setGbPeriod(v) { gbPeriod = v; renderApp(); }
function setGbPassing(v) {
  const n = parseFloat(v);
  if (isNaN(n) || n < 0 || n > 100) { showToast('La nota mínima debe estar entre 0 y 100.', 'warning'); renderApp(); return; }
  gbData().passing = n; saveAppState(appState); renderApp();
}

function setGbScore(kind, id, sid, raw) {
  if (appState.currentRole !== 'teacher') return;
  const v = String(raw).trim() === '' ? null : parseFloat(raw);
  if (kind === 'act') {
    const a = gbData().activities.find(x => x.id === id);
    if (v !== null && (isNaN(v) || v < 0 || v > a.max)) { showToast(`El puntaje debe estar entre 0 y ${a.max}.`, 'warning'); renderApp(); return; }
    gbData().scores[id] = gbData().scores[id] || {};
    if (v === null) delete gbData().scores[id][sid]; else gbData().scores[id][sid] = v;
  } else {
    const t = appState.tasks.find(x => x.id === id);
    if (v !== null && (isNaN(v) || v < 0 || v > t.points)) { showToast(`El puntaje debe estar entre 0 y ${t.points}.`, 'warning'); renderApp(); return; }
    t.submissions = t.submissions || {};
    let s = t.submissions[sid];
    if (v === null) {
      if (s && s.manual && !(s.files || []).length) delete t.submissions[sid];
      else if (s) { s.grade = null; s.criteriaScores = {}; }
    } else {
      if (!s) s = t.submissions[sid] = { files: [], notes: '', submittedAt: '', feedback: '', criteriaScores: {}, manual: true };
      s.grade = v;
    }
  }
  saveAppState(appState);
  renderApp();
}

function gbBuildMatrix() {
  const items = gbItems(gbSubject, gbPeriod);
  const header = ['Participante', ...items.map(i => `${i.title} (/${i.max})`), 'Obtenidos', 'Posibles', '%', 'Estado'];
  const rows = appState.students.map(st => {
    const t = gbTotals(items, st.id);
    return [st.name, ...items.map(i => { const v = gbScore(i, st.id); return v === null ? '' : v; }), t.got, t.poss, t.pct === null ? '' : t.pct, t.pct === null ? '' : (t.pct >= gbData().passing ? 'Aprobado' : 'Reprobado')];
  });
  return { header, rows };
}
function exportGradebookCSV() {
  const { header, rows } = gbBuildMatrix();
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = '\uFEFF' + [header, ...rows].map(r => r.map(q).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `Registro_de_Grado_${gbSubject.replace(/\s+/g, '_')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function printGradebook() {
  const { header, rows } = gbBuildMatrix();
  const w = window.open('', '_blank');
  if (!w) { showToast('Tu navegador bloqueó la ventana de impresión. Permite ventanas emergentes.', 'warning'); return; }
  w.document.write(`<html><head><title>Registro de Grado</title><style>body{font-family:Arial,sans-serif;padding:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #444;padding:5px;text-align:center}td:first-child,th:first-child{text-align:left}</style></head><body>
    <h2>Registro de Grado · ${escAttr(gbSubject)}${gbPeriod !== 'all' ? ' · Período ' + gbPeriod : ''}</h2>
    <table><thead><tr>${header.map(h => `<th>${escAttr(h)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr>${r.map(c => `<td>${escAttr(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>
    <p style="font-size:11px">Nota mínima de aprobación: ${gbData().passing}. Impreso: ${new Date().toLocaleDateString('es-DO')}</p></body></html>`);
  w.document.close();
  w.focus();
  w.print();
}

}

function handleBulkStudentsSubmit(e) {
  e.preventDefault();
  const names = document.getElementById('st-bulk-names').value.split(/\r?\n/).map(n => n.replace(/[<>]/g, '').trim()).filter(Boolean);
  if (!names.length) return;
  const grade = document.getElementById('st-bulk-grade').value.trim() || '—';
  const modality = document.getElementById('st-bulk-modality').value;
  const base = Date.now();
  names.forEach((name, i) => {
    appState.students.push({
      id: 'std-' + (base + i),
      code: 'R15-' + new Date().getFullYear() + '-' + String(appState.students.length + 1).padStart(3, '0'),
      name, email: '', grade, modality, avatar: '🎓', stars: 0, attendanceRate: 100
    });
  });
  saveAppState(appState);
  closeModal('modal-st-bulk');
  renderApp();
  showToast(names.length + ' participante(s) agregado(s).', 'success');
}

function handleRegisterStudentSubmit(e) {

  const modality = document.getElementById('st-reg-modality').value;

  const newStudent = {
    id: 'std-' + Date.now(),
    code: code,
    name: name,
    email: `${name.toLowerCase().replace(/[^a-z]/g, '.')}@prepara360.edu.do`,
    grade: grade,
    modality: modality,
    avatar: avatar,
    stars: 30,
    attendanceRate: 100

  closeModal('modal-st-reg');

    <div class="modal-overlay active" id="modal-st-edit">
      <div class="modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">

function handleEditStudentSubmit(e, studentId) {
  e.preventDefault();
  const student = appState.students.find(s => s.id === studentId);
  if (student) {
    const oldStudentName = student.name;
    student.name = document.getElementById('st-edit-name').value.trim();
    if (oldStudentName !== student.name) {
      appState.forumPosts.forEach(p => {
        if (p.authorRole === 'student' && p.author === oldStudentName) p.author = student.name;
        (p.replies || []).forEach(r => {
          if (r.authorRole === 'student' && r.author === oldStudentName) r.author = student.name;
        });
      });
    }
    student.code = document.getElementById('st-edit-code').value.trim();
    student.grade = document.getElementById('st-edit-grade').value.trim();
    student.modality = document.getElementById('st-edit-modality').value;

    saveAppState(appState);
    closeModal('modal-st-edit');
    renderApp();
    showToast(`Datos de ${student.name} actualizados.`, 'success');
  }
}

function deleteStudent(studentId) {
  if (appState.currentRole !== 'teacher') return;
  const student = appState.students.find(s => s.id === studentId);
  if (!student) return;

  if (confirm(`¿Dar de baja al participante ${student.name}?`)) {
    appState.students = appState.students.filter(s => s.id !== studentId);
    if (appState.attendance) {
      Object.keys(appState.attendance).forEach(d => { delete appState.attendance[d][studentId]; });
    }
    if (appState.currentStudentId === studentId) {
      appState.currentStudentId = appState.students.length ? appState.students[0].id : '';
    }
    saveAppState(appState);
    renderApp();
    showToast('Participante dado de baja del registro.', 'info');
  }
}

function switchTab(tab) {
  const role = sessionStorage.getItem('prepara360_authenticated_role');
  // Restricción de navegación: el participante no puede abrir módulos exclusivos del docente.
  const teacherOnlyTabs = ['attendance'];
  if (role !== 'teacher' && teacherOnlyTabs.includes(tab)) {
    showToast('Acceso restringido: esta sección es exclusiva del docente.', 'warning');
    currentTab = 'dashboard';
    renderApp();
    return;
  }
  if (!['dashboard','subjects','tasks','resources','videos','forum','students','attendance','calendar','gradebook'].includes(tab)) {
    currentTab = 'dashboard';
  } else {
    currentTab = tab;
  }
  renderApp();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleRole() {
  // Los roles solo se cambian mediante el código de acceso.
  logoutAccess();
}

function changeActiveStudent(studentId) {
  if (sessionStorage.getItem('prepara360_authenticated_role') !== 'teacher') {

function resetDemoData() {
  if (sessionStorage.getItem('prepara360_authenticated_role') !== 'teacher') {
    showToast('Acceso restringido: solo el docente puede restaurar los datos.', 'warning');
    return;
  }
  if (confirm('¿Restaurar los datos de demostración a su estado inicial?')) {

// Sistema de Notificaciones Toast
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️'}</span> <span>${message}</span>`;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    setTimeout(() => toast.remove(), 400);
  }, 3500);
}

// Confeti Festivo para Entregas de Tareas
function fireConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];

  for (let i = 0; i < 90; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.7) * 14,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      rotation: Math.random() * 360
    });
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = false;

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.25; // Gravedad
      p.alpha -= 0.012;

      if (p.alpha > 0) {
        active = true;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }
    });

    if (active) {
      requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  requestAnimationFrame(animate);
}

  <script>
/* Interactividad del título: foco de luz y paralaje con el puntero */
(function () {
  let raf = null, last = null;
  function apply() {
    raf = null;
    const h = document.getElementById('p360-hero');
    if (!h || !last) return;
    const r = h.getBoundingClientRect();
    const x = last.clientX - r.left, y = last.clientY - r.top;
    h.style.setProperty('--mx', x + 'px');
    h.style.setProperty('--my', y + 'px');
    h.style.setProperty('--px', (x / r.width - 0.5).toFixed(3));
    h.style.setProperty('--py', (y / r.height - 0.5).toFixed(3));
  }
  document.addEventListener('mousemove', function (e) {
    last = e;
    if (!raf) raf = requestAnimationFrame(apply);
  }, { passive: true });
})();

  </script>
